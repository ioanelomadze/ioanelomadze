            <h1>თოვლი თბილისის</h1>

            <div class="poem-divider"></div>


            <div class="poem-text">

                <p>
                    ლამაზია თოვლი თბილისის<br>
                    და რომ გკოცნი ვინ იცის,<br>
                    როგორ გადის დრო?!<br>
                    ვინ ჰყვება ამბებს,<br>
                    მიჰყვება ნაღმებს,<br>
                    რომ ტოვებს დაღებს,<br>
                    ასწვდება თაღებს,<br>
                    აწყდება კარებს,<br>
                    გულის კარს რომ აღებს,<br>

                </p>



            </div>
